name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: jdx/mise-action@v2
      - run: mise run lint
      - run: mise run test

  colour-tokens:
    # src/tokens/glyphs-colors.zsh is generated: re-run the sync at the pinned
    # @kud/glyphs version and fail if the committed file has drifted from it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: zsh scripts/sync-colors.zsh
      - run: git diff --exit-code -- src/tokens/glyphs-colors.zsh
