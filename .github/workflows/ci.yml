name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: jdx/mise-action@v2
      - run: mise run lint
      - run: mise run test
